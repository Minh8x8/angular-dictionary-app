<p-toolbar
  class="sticky-header header-toolbar shadow-sm bg-slate-50 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800"
>
  <div class="p-toolbar-group-start flex items-center gap-3">
    <a class="logo-container no-underline" routerLink="/home" aria-label="Go to home">
      <span class="logo-mark" aria-hidden="true"></span>
    </a>
    <a class="app-title no-underline" routerLink="/home">Dictionary</a>
  </div>

  <div class="p-toolbar-group-center hidden md:flex items-center w-full max-w-lg mx-auto">
    <app-search-input class="w-full"></app-search-input>
  </div>

  <div class="p-toolbar-group-end flex items-center gap-2 nav-links">
    <p-button label="Home" link routerLink="/home" />
    <p-button label="About" link routerLink="/about" />
    <button
      pButton
      link
      type="button"
      [icon]="isDark() ? 'pi pi-sun' : 'pi pi-moon'"
      class="p-button-rounded p-button-text"
      (click)="toggleDarkMode()"
      [attr.aria-pressed]="isDark()"
      aria-label="Toggle dark mode"
    ></button>
  </div>
</p-toolbar>
